services:
  postgres:
    image: postgres:16-alpine
    container_name: emberhall-postgres
    environment:
      POSTGRES_DB: emberhall
      POSTGRES_USER: emberhall
      POSTGRES_PASSWORD: emberhall
    ports:
      - "5432:5432"
    volumes:
      - emberhall-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emberhall"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: emberhall-redis
    ports:
      - "6379:6379"
    volumes:
      - emberhall-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  emberhall-postgres:
  emberhall-redis:
